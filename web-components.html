<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Components</title>
  <link rel="stylesheet" href="framework.css">
  <script type="module" src="elements/fw-card.js"></script>
</head>
<body>
  <fw-card>
    <h3 slot="header">Cordless drill</h3>
    <p>Borrow it for up to 7 days.</p>
    <span slot="footer">Available now</span>
  </fw-card>
  <fw-card variant="elevated">
    <h3 slot="header"> Broken Cordless drill</h3>
    <p>Borrow it for up to 2 days.</p>
    <span slot="footer">Available not now</span>
  </fw-card>
</body>

</html>
